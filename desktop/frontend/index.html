<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Trojan-Go Desktop</title>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="30" height="30">
              <defs>
                <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#5b9bff" />
                  <stop offset="1" stop-color="#22c7a9" />
                </linearGradient>
              </defs>
              <path d="M16 3 27 8v8c0 6.2-4.4 10.7-11 13C9.4 26.7 5 22.2 5 16V8l11-5Z" fill="url(#brandGradient)" opacity=".18" />
              <path d="M16 3 27 8v8c0 6.2-4.4 10.7-11 13C9.4 26.7 5 22.2 5 16V8l11-5Z" fill="none" stroke="url(#brandGradient)" stroke-width="1.6" />
              <path d="M16 10v7.5" stroke="#8fb8ff" stroke-width="2.2" stroke-linecap="round" />
              <circle cx="16" cy="21.5" r="1.5" fill="#8fb8ff" />
            </svg>
          </div>
          <div class="brand-text">
            <div class="brand-title">Trojan-Go</div>
            <div class="brand-sub">Desktop</div>
          </div>
        </div>

        <nav class="nav" aria-label="主导航">
          <a class="nav-item" href="#/" data-nav="home">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1V10.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            <span>首页</span>
          </a>
          <a class="nav-item" href="#/profiles" data-nav="profiles">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>配置</span>
          </a>
          <a class="nav-item" href="#/settings" data-nav="settings">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 13.5a7.8 7.8 0 0 0 0-3l2-1.5-2-3.4-2.4 1a7.8 7.8 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.6A7.8 7.8 0 0 0 7 6.6l-2.4-1-2 3.4 2 1.5a7.8 7.8 0 0 0 0 3l-2 1.5 2 3.4 2.4-1a7.8 7.8 0 0 0 2.6 1.5l.4 2.6h4l.4-2.6a7.8 7.8 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <span>设置</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-status">
            <span class="status-dot" id="sidebar-status-dot"></span>
            <span id="sidebar-status-text">已停止</span>
          </div>
          <div class="version-pill" id="sidebar-version">v0.1.0</div>
        </div>
      </aside>

      <main class="main">
        <div class="view" id="view" aria-live="polite"></div>
      </main>
    </div>

    <div class="toast-stack" id="toast-stack" aria-live="assertive"></div>
    <div id="modal-root"></div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
