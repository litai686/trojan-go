version: '3'

includes:
  common: ../Taskfile.yml

vars:
  COMMIT:
    sh: git rev-parse --short HEAD
  BUILD_TIME: '{{now | date "2006-01-02T15:04:05Z07:00"}}'

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      - task: build:native
    vars:
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  build:native:
    summary: Builds the application using native Go compilation
    internal: true
    deps:
      - task: common:sync:version
        vars:
          VERSION: '{{.VERSION}}'
      - task: common:go:mod:tidy
      - task: common:generate:icons
      - task: common:stage:trojan
        vars:
          GOOS: windows
          ARCH: '{{.ARCH | default ARCH}}'
    cmds:
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: powershell -NoProfile -Command "Remove-Item -Force *.syso -ErrorAction SilentlyContinue"
        platforms: [windows]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l" -ldflags="-X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildTime={{.BUILD_TIME}}"{{else}}-trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildTime={{.BUILD_TIME}}"{{end}}'
    env:
      GOOS: windows
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  generate:syso:
    summary: Generates the Windows .syso resource file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH | default ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH | default ARCH}}.syso

  package:
    summary: Creates an NSIS installer (per-user install by default)
    cmds:
      - task: create:nsis:installer
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "user"}}'
    vars:
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "user"}}'

  create:nsis:installer:
    summary: Creates an NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
    preconditions:
      - sh: '[ "{{.INSTALL_SCOPE}}" = "user" ] || [ "{{.INSTALL_SCOPE}}" = "machine" ]'
        msg: "INSTALL_SCOPE must be 'user' or 'machine', got '{{.INSTALL_SCOPE}}'"
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - |
        {{if eq OS "windows"}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "user"}}'

  package:portable:
    summary: Creates a portable zip containing the app and trojan-go.exe
    deps:
      - task: build
    cmds:
      - powershell -NoProfile -Command "Compress-Archive -Force -Path '{{.BIN_DIR}}/{{.APP_NAME}}.exe','{{.BIN_DIR}}/trojan-go.exe' -DestinationPath '{{.BIN_DIR}}/{{.APP_NAME}}-windows-{{.ARCH | default ARCH}}.zip'"

  run:
    env:
      TROJAN_DESKTOP_EMBEDDED_FRONTEND: "1"
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
