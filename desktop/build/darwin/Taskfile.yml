version: '3'

includes:
  common: ../Taskfile.yml

vars:
  VERSION: '{{.VERSION | default "0.1.0"}}'
  COMMIT:
    sh: git rev-parse --short HEAD
  BUILD_TIME: '{{now | date "2006-01-02T15:04:05Z07:00"}}'

tasks:
  build:
    summary: Builds the application for macOS
    deps:
      - task: common:go:mod:tidy
      - task: common:generate:icons
      - task: common:stage:trojan
        vars:
          GOOS: darwin
          ARCH: '{{.ARCH | default ARCH}}'
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}"
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l" -ldflags="-X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildTime={{.BUILD_TIME}}"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildTime={{.BUILD_TIME}}"{{end}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  package:
    summary: Packages the application into a .app bundle
    deps:
      - task: build
    cmds:
      - task: create:app:bundle

  create:app:bundle:
    summary: Creates the .app bundle with trojan-go inside Contents/MacOS
    cmds:
      - rm -rf -- "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/trojan-go "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/trojan-go"
      - chmod +x "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/trojan-go"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      - task: '{{if eq OS "darwin"}}codesign:adhoc{{else}}codesign:skip{{end}}'

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle (macOS only)
    internal: true
    cmds:
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  codesign:skip:
    summary: Skips codesigning when cross-compiling
    internal: true
    cmds:
      - 'echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."'

  run:
    env:
      TROJAN_DESKTOP_EMBEDDED_FRONTEND: "1"
    cmds:
      - open "{{.BIN_DIR}}/{{.APP_NAME}}.app"
