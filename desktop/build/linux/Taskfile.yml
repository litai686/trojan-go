version: '3'

includes:
  common: ../Taskfile.yml

vars:
  COMMIT:
    sh: git rev-parse --short HEAD
  BUILD_TIME: '{{now | date "2006-01-02T15:04:05Z07:00"}}'
  APPIMAGE_ARCH: '{{if eq (.ARCH | default ARCH) "arm64"}}aarch64{{else}}x86_64{{end}}'
  APPIMAGE_NAME: '{{.APP_NAME}}-linux-{{.ARCH | default ARCH}}.AppImage'

tasks:
  build:
    summary: Builds the application for Linux
    deps:
      - task: common:go:mod:tidy
      - task: common:generate:icons
      - task: common:stage:trojan
        vars:
          GOOS: linux
          ARCH: '{{.ARCH | default ARCH}}'
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}"
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l" -ldflags="-X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildTime={{.BUILD_TIME}}"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildTime={{.BUILD_TIME}}"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Creates the AppImage used for installation and auto-update
    deps:
      - task: build
    cmds:
      - task: create:appimage

  create:appimage:
    summary: Builds an AppImage containing the app and trojan-go
    deps:
      - task: generate:dotdesktop
    cmds:
      - mkdir -p build/linux/appimage/out
      - wails3 generate appimage -binary "{{.BIN_DIR}}/{{.APP_NAME}}" -icon build/appicon.png -desktopfile build/linux/{{.APP_NAME}}.desktop -outputdir build/linux/appimage/out -builddir build/linux/appimage/build
      - task: repack:appimage

  repack:appimage:
    summary: Adds trojan-go to the AppDir and repacks the AppImage
    internal: true
    dir: build/linux/appimage/build
    env:
      OUTPUT: '{{.APPIMAGE_NAME}}'
    cmds:
      - cp "{{.ROOT_DIR}}/{{.BIN_DIR}}/trojan-go" "{{.APP_NAME}}-{{.APPIMAGE_ARCH}}.AppDir/usr/bin/trojan-go"
      - chmod +x "{{.APP_NAME}}-{{.APPIMAGE_ARCH}}.AppDir/usr/bin/trojan-go"
      - ./linuxdeploy-{{.APPIMAGE_ARCH}}.AppImage --appimage-extract-and-run --appdir "{{.APP_NAME}}-{{.APPIMAGE_ARCH}}.AppDir" --output appimage
      - mv "{{.APPIMAGE_NAME}}" "{{.ROOT_DIR}}/{{.BIN_DIR}}/"

  generate:dotdesktop:
    summary: Generates the .desktop file used by the AppImage
    dir: build
    cmds:
      - mkdir -p linux
      - wails3 generate .desktop -name "{{.APP_NAME}}" -exec "{{.APP_NAME}}" -icon "appicon" -outputfile "linux/{{.APP_NAME}}.desktop" -categories "Network;"

  run:
    env:
      TROJAN_DESKTOP_EMBEDDED_FRONTEND: "1"
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
