name: release-build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build linux/windows/macos binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and package
        run: |
          bash build.sh --release \
            --target linux-amd64,linux-arm64,darwin-amd64,darwin-arm64,windows-amd64,windows-arm64

      - name: Show artifacts
        run: ls -lh trojan-go-*.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trojan-go-binaries
          path: trojan-go-*.zip
          if-no-files-found: error

      - name: Remove stale release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release delete "$TAG_NAME" --yes || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: trojan-go-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
