name: release-build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build linux/windows/macos binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and package
        run: |
          bash build.sh --release \
            --target linux-amd64,linux-arm64,darwin-amd64,darwin-arm64,windows-amd64,windows-arm64

      - name: Show artifacts
        run: ls -lh trojan-go-*.zip

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" trojan-go-*.zip --clobber
          else
            gh release create "$TAG_NAME" trojan-go-*.zip \
              --title "$TAG_NAME" \
              --prerelease \
              --generate-notes
          fi
